[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-cp-abe"
dynamic = ["version"]
description = "Python bindings for the Hybrid-PQ-CP-ABE native cryptography library"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["pq_cp_abe", "pq_cp_abe._libs"]
include-package-data = false

[tool.setuptools.package-data]
pq_cp_abe = ["_libs/*.dll", "_libs/*.so", "_libs/*.dylib"]
