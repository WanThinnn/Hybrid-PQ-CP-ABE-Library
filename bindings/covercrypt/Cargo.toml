[package]
name = "covercrypt-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "covercrypt_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cosmian_cover_crypt = { path = "../../vendor/cover_crypt", default-features = false, features = ["curve25519", "mlkem-768"] }
cosmian_crypto_core = { version = "11.0", default-features = false, features = ["ser"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"

[profile.release]
opt-level = 3
panic = "unwind"
