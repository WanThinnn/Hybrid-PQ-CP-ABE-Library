name: Build npm Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the WASM release ZIP
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          archive="libhybrid-pq-cp-abe_wasm_v${version}.zip"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/wasm-release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify, pack and test
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          python3 bindings/npm/pack_release.py \
            --archive "$RUNNER_TEMP/wasm-release/$ARCHIVE" \
            --checksums "$RUNNER_TEMP/wasm-release/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build/release/npm/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist

      - name: Publish the tested tarball with npm Trusted Publishing
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
        run: |
          shopt -s nullglob
          tarballs=(dist/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected exactly one tested npm tarball." >&2
            exit 1
          fi
          tag=latest
          if [[ "$PACKAGE_VERSION" == *-* ]]; then tag=next; fi
          tarball="$(realpath "${tarballs[0]}")"
          npm publish "$tarball" --access public --tag "$tag"
