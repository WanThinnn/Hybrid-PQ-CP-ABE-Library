name: Build Vault Plugin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the verified Vault plugin archive to the corresponding GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vault-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Vault Plugin Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      JOBS: '4'

    steps:
      - name: Keep shell scripts in LF format
        run: git config --global core.autocrlf input

      - name: Checkout project sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: plugins/vault/vault-plugin-abe/go.mod
          cache-dependency-path: |
            plugins/vault/vault-plugin-abe/go.sum
            bindings/tkn20/go.sum

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build native dependencies
        run: make deps -j4

      - name: Build and test Vault plugin
        run: make test-vault -j4

      - name: Package and verify Vault archive
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python scripts/package-release.py --vault --platform linux --arch x86_64 --version "$version"

      - name: Upload verified Vault artifact
        uses: actions/upload-artifact@v7
        with:
          name: vault-plugin-linux-x86_64
          path: build/release/vault-plugin-abe_linux_*.zip
          if-no-files-found: error

  attach:
    name: Attach Vault plugin to GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout VERSION
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Download verified Vault artifact
        uses: actions/download-artifact@v8
        with:
          name: vault-plugin-linux-x86_64
          path: dist

      - name: Upload Vault archive to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          shopt -s nullglob
          archives=(dist/vault-plugin-abe_linux_*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected one verified Vault archive, found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          name="${archive##*/}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -Fxq -- "$name" <<< "$assets"; then
            echo "Already attached to $tag: $name"
          else
            gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY"
          fi
