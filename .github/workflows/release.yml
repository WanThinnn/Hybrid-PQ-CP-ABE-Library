name: Release Library

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux, arch: x86_64}
          - {runner: windows-2022, platform: windows, arch: x86_64}
          - {runner: macos-15-intel, platform: macos, arch: x86_64}
          - {runner: macos-15, platform: macos, arch: arm64}
    env:
      CARGO_TERM_COLOR: never
      JOBS: '4'
    steps:
      - name: Keep shell scripts in LF format
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6
        with:
          # Build from source rather than downloading historical LFS binaries.
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/tkn20/go.mod
          cache-dependency-path: bindings/tkn20/go.sum

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - name: Expose Windows Make and CGO compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS_ROOT\usr\bin" >> $env:GITHUB_PATH
          "$env:MSYS_ROOT\mingw64\bin" >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "$RUNNER_OS" == Windows ]]; then
            rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
            rustup default stable-x86_64-pc-windows-msvc
          fi

      - name: Build and test Unix libraries
        if: runner.os != 'Windows'
        run: |
          make deps -j4
          make -j4
          make test -j4

      - name: Test release packaging checks
        run: python -m unittest discover -s tests -p test_release_package.py

      - name: Test configure without installing host packages
        run: python -m unittest discover -s tests -p test_configure.py -v

      - name: Test vendor Git workflow with local repositories
        run: python -m unittest discover -s tests -p test_vendor_git.py -v

      - name: Build and test MSVC libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Keep MSVC link.exe ahead of the unrelated MSYS utility of that name.
          $env:PATH = (Split-Path (Get-Command cl.exe).Source) + ';' + $env:PATH
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/test-dependency-hashes.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & make deps -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & make -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & make tests -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -m unittest discover -s tests -p test_windows_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/artifacts/windows/tests | Out-Null
          & cl.exe /nologo /MD /EHsc /utf-8 /Ibuild/deps/windows/include tests/cpp/cryptopp_dll_smoke.cpp /Fobuild/artifacts/windows/tests/cryptopp_dll_smoke.obj /Febuild/artifacts/windows/tests/cryptopp_dll_smoke.exe /link /LIBPATH:build/deps/windows/lib/cryptopp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD\build\deps\windows\lib\cryptopp;" + $env:PATH
          & ./build/artifacts/windows/tests/cryptopp_dll_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify release archive
        # Both platform build steps above have completed before these CLI checks.
        run: |
          python -m unittest discover -s tests -p test_cli_covercrypt_demo.py -v
          python -m unittest discover -s tests -p test_covercrypt_boolean.py -v
          python -m unittest discover -s tests -p test_covercrypt_growth.py -v
          python -m unittest discover -s tests -p test_version_header.py -v
          python scripts/package-release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/release/*.zip
          if-no-files-found: error

  publish:
    name: Attach all platform packages to release
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true

      - name: Verify all four packages and prepare checksums
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/package-release.py --verify-assets build/release --version "$RELEASE_TAG"
          cd build/release
          sha256sum *.zip > SHA256SUMS.txt
          cd ../..
          if [[ -f "release_notes/$RELEASE_TAG.md" ]]; then
            echo "path=release_notes/$RELEASE_TAG.md" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ github.event_name != 'release' }}
          prerelease: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name != 'release' && (contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha'))) }}
