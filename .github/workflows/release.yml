name: Release Library

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_win:
        description: 'Build Windows package'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux package'
        required: false
        type: boolean
        default: true

env:
  LIB_NAME: libhybrid-pq-cp-abe

jobs:
  build-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get version and platform flags
        id: config
        run: |
          # Get version
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          
          # Get platform flags (default: both if tag push, otherwise use inputs)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: build both by default
            BUILD_WIN=true
            BUILD_LINUX=true
          else
            # workflow_dispatch: use inputs
            BUILD_WIN="${{ github.event.inputs.build_win }}"
            BUILD_LINUX="${{ github.event.inputs.build_linux }}"
          fi
          echo "build_win=${BUILD_WIN}" >> $GITHUB_OUTPUT
          echo "build_linux=${BUILD_LINUX}" >> $GITHUB_OUTPUT
          echo "Build Windows: ${BUILD_WIN}"
          echo "Build Linux: ${BUILD_LINUX}"

      # ========================================================================
      # Build Linux Package
      # ========================================================================
      - name: Prepare Linux package
        if: steps.config.outputs.build_linux == 'true'
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          PACKAGE_NAME="${{ env.LIB_NAME }}_linux_x86_64_v${VERSION}"
          
          mkdir -p "${PACKAGE_NAME}/include"
          mkdir -p "${PACKAGE_NAME}/lib"
          
          # Copy header files
          cp -r src/cpp/include/hybrid_pq_cp_abe "${PACKAGE_NAME}/include/"
          
          # Copy libhybrid-pq-cp-abe and its static dependencies for Linux
          cp src/cpp/lib/dynamic/libhybrid-pq-cp-abe.so "${PACKAGE_NAME}/lib/" 2>/dev/null || true
          cp src/cpp/lib/static/libhybrid-pq-cp-abe.a "${PACKAGE_NAME}/lib/" 2>/dev/null || true
          
          # Create zip
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          
          echo "Created: ${PACKAGE_NAME}.zip"
          echo "Package contents:"
          unzip -l "${PACKAGE_NAME}.zip"

      # ========================================================================
      # Build Windows Package
      # ========================================================================
      - name: Prepare Windows package
        if: steps.config.outputs.build_win == 'true'
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          PACKAGE_NAME="${{ env.LIB_NAME }}_win_x86_64_v${VERSION}"
          
          mkdir -p "${PACKAGE_NAME}/include"
          mkdir -p "${PACKAGE_NAME}/lib"
          
          # Copy header files
          cp -r src/cpp/include/hybrid_pq_cp_abe "${PACKAGE_NAME}/include/"
          
          # Copy libhybrid-pq-cp-abe and its DLL dependencies for Windows
          cp src/cpp/lib/dynamic/libhybrid-pq-cp-abe.dll "${PACKAGE_NAME}/lib/" 2>/dev/null || true
          cp src/cpp/lib/static/libhybrid-pq-cp-abe.lib "${PACKAGE_NAME}/lib/" 2>/dev/null || true
          cp src/cpp/lib/dynamic/libcpabe_tkn20.dll "${PACKAGE_NAME}/lib/" 2>/dev/null || true
          
          # Create zip
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          
          echo "Created: ${PACKAGE_NAME}.zip"
          echo "Package contents:"
          unzip -l "${PACKAGE_NAME}.zip"

      # ========================================================================
      # Prepare Release Notes
      # ========================================================================
      - name: Prepare Release Notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.config.outputs.version }}"
          NOTES_FILE="release_notes/v${VERSION}.md"
          
          if [ -f "$NOTES_FILE" ]; then
            echo "Found release notes at $NOTES_FILE"
            echo "path=$NOTES_FILE" >> $GITHUB_OUTPUT
          else
            echo "Release notes file $NOTES_FILE not found. Falling back to auto-generated notes."
            echo "path=" >> $GITHUB_OUTPUT
          fi

      # ========================================================================
      # Create GitHub Release
      # ========================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.LIB_NAME }}_linux_x86_64_v${{ steps.config.outputs.version }}.zip
            ${{ env.LIB_NAME }}_win_x86_64_v${{ steps.config.outputs.version }}.zip
          fail_on_unmatched_files: false
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
